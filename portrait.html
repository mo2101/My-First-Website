  const gallery = document.getElementById('portrait-gallery');

  portraits.forEach(photo => {
    const card = document.createElement('div');
    card.className = 'card';
    card.setAttribute('data-caption', photo.caption);

    // thumbnail image
    const img = document.createElement('img');
    img.src = photo.thumb;
    img.setAttribute("data-full", photo.full);
    img.loading = 'lazy';
    img.alt = photo.caption || 'Portrait photo';

    card.appendChild(img);

    // OPTIONAL: click to open full-res in new tab
    card.addEventListener('click', () => {
      window.open(photo.full, '_blank');
    });

    gallery.appendChild(card);
  });
</script>
<script>
  const observer = new IntersectionObserver(entries => {
    entries.forEach(entry => {
      if (entry.isIntersecting) {
        const card = entry.target;
        const img = card.querySelector('img');
        const fullRes = img.getAttribute("data-full");

        // swap small → full
        img.src = fullRes;
        img.removeAttribute("data-full");

        observer.unobserve(card);
      }
    });
  }, {
    rootMargin: "100px"
  });

  document.querySelectorAll(".card").forEach(card => {
    observer.observe(card);
  });
</script>
