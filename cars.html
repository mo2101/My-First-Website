<!DOCTYPE html>
<html lang="en">
<head>
    <title>Photos | Baki Photography</title>
    <link rel="stylesheet" href="css/cars.css">
    <!-- Mobile tap-to-zoom overrides -->
    <style>
      /* Zoom via class on touch devices */
      .card.active{
        transform: scale(1.6);
        z-index: 3;
      }
      /* If you have captions via ::after, show them when active */
      .card.active::after{ opacity: 1; }

      /* On touch, ignore hover-based zoom/blur from the external CSS */
      .cards.touch-active .card:hover{ transform: none !important; }
      .cards.touch-active > .card:not(.active){
        filter: blur(2px);
        transform: scale(0.92);      /* no unintended scaling */
      }

      /* Optional: make the zoom a bit smaller on small screens */
      @media (max-width: 600px){
        .card.active{ transform: scale(1.35); }
      }
    </style>
</head>
<body>
    <div class="banner" loading="lazy">
        <div class="navbar">
            <img src="signature.PNG" class="signature" alt="Signature">
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="pictures.html">Photos</a></li>
                <li><a href="videos.html">Videos</a></li>
                <li><a href="contact.html">Contact</a></li>
                <li><a href="booking.html">Booking</a></li>
                <li><a href="review.html">Reviews</a></li>
            </ul>
        </div>
        <div class="contentone">
            <h1>CARS</h1>
        </div>
        <div class="cards" id="cars-gallery"></div>
        </div>
        <footer class="site-footer">
            © <span id="year"></span> Baki Photography — All rights reserved.
        </footer>

    </div>

    <!-- Progressive background swap -->
    <script>
  // 1) All your car photos defined in one place
  const cars = [
    { thumb: '../pics/small/bmw-small.jpg',           full: '../pics/bmw.jpg',           caption: 'BMW' },
    { thumb: '../pics/small/challengerblue-small.JPG', full: '../pics/challengerblue.jpg', caption: 'Challenger' },
    { thumb: '../pics/small/ycar-small.JPG',          full: '../pics/ycar.jpg',          caption: 'Antique' },
    { thumb: '../pics/small/oldblue-small.JPG',       full: '../pics/oldblue.jpg',       caption: 'Antique' },
    { thumb: '../pics/small/mar-small.JPG',           full: '../pics/mar.jpg',           caption: 'AMG' },
    { thumb: '../pics/small/marback-small.JPG',       full: '../pics/marback.jpg',       caption: 'AMG' },
    { thumb: '../pics/small/marfront-small.JPG',      full: '../pics/marfront.jpg',      caption: 'AMG' },
    { thumb: '../pics/small/yidk-small.JPG',          full: '../pics/yidk.jpg',          caption: 'Corvette' },
    { thumb: '../pics/small/bporsche-small.JPG',      full: '../pics/porsche.jpg',      caption: 'Porsche' },
    { thumb: '../pics/small/jsrt-small.JPG',          full: '../pics/rsrt.jpg',          caption: 'SRT' },
    { thumb: '../pics/small/bmwb-small.JPG',          full: '../pics/bmwb.jpg',          caption: 'BMW' },
    { thumb: '../pics/small/wporsche-small.JPG',      full: '../pics/wporsche.jpg',      caption: 'Porsche' },
    { thumb: '../pics/small/rsrt-small.JPG',          full: '../pics/srt.jpg',          caption: 'SRT' },
    { thumb: '../pics/small/ycorvette-small.JPG',     full: '../pics/ycorvette.jpg',     caption: 'Corvette' },
    { thumb: '../pics/small/salem-small.JPG',         full: '../pics/salem.jpg',         caption: 'Bike' },
    { thumb: '../pics/small/wchallenger-small.JPG',   full: '../pics/wchallenger.jpg',   caption: 'Challenger' },
    { thumb: '../pics/small/oldwcar-small.jpg',       full: '../pics/oldwcar.jpg',       caption: 'Antique' },
    { thumb: '../pics/small/bprosche-small.JPG',      full: '../pics/bprosche.jpg',     caption: 'Porsche' },
    { thumb: '../pics/small/lambo-small.JPG',         full: '../pics/lambo.jpg',        caption: 'Lamborghini' },
    { thumb: '../pics/small/challenge-small.JPG',     full: '../pics/challenge.jpg',     caption: 'Challenger' },
  ];

  document.addEventListener('DOMContentLoaded', () => {
    const gallery = document.getElementById('cars-gallery');

    // 2) Build the cards dynamically
    cars.forEach(photo => {
      const card = document.createElement('div');
      card.className = 'card';
      card.dataset.caption = photo.caption;
      card.style.backgroundImage = `url('${photo.thumb}')`; // small image first
      card.dataset.full = photo.full;                       // store full-res path
      gallery.appendChild(card);
    });

    // 3) Lazy swap small -> full when card comes into view
    const cards = document.querySelectorAll('.card');

    if ('IntersectionObserver' in window) {
      const io = new IntersectionObserver((entries) => {
        entries.forEach(entry => {
          if (!entry.isIntersecting) return;
          const card = entry.target;
          const full = card.dataset.full;
          if (!full) { io.unobserve(card); return; }

          const img = new Image();
          img.src = full;
          img.onload = () => {
            card.style.backgroundImage = `url('${full}')`;
            delete card.dataset.full;
          };
          io.unobserve(card);
        });
      }, { rootMargin: '150px 0px' });

      cards.forEach(card => io.observe(card));
    } else {
      // fallback: just load full images
      cards.forEach(card => {
        const full = card.dataset.full;
        if (!full) return;
        const img = new Image();
        img.src = full;
        img.onload = () => {
          card.style.backgroundImage = `url('${full}')`;
          delete card.dataset.full;
        };
      });
    }

    // 4) Footer year
    const y = document.getElementById('year');
    if (y) y.textContent = new Date().getFullYear();

    // 5) Tap-to-zoom for mobile (uses the same .card.active + .cards.touch-active CSS you already have)
    const isTouch =
      (window.matchMedia && window.matchMedia('(pointer: coarse)').matches) ||
      'ontouchstart' in window;

    const cardsWrap = document.querySelector('.cards');
    if (isTouch && cardsWrap && cards.length) {
      cardsWrap.classList.add('touch-active');

      cards.forEach(card => {
        card.addEventListener('click', (e) => {
          const wasActive = card.classList.contains('active');
          cards.forEach(c => c.classList.remove('active'));
          if (!wasActive) card.classList.add('active');
          e.stopPropagation();
        }, { passive: true });
      });

      document.addEventListener('click', () => {
        cards.forEach(c => c.classList.remove('active'));
      }, { passive: true });

      document.addEventListener('keydown', (e) => {
        if (e.key === 'Escape') cards.forEach(c => c.classList.remove('active'));
      });
    }
  });
</script>

</body>
</html>
