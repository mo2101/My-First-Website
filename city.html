    <script>
        // Swap blurred small background with full image once loaded
        document.addEventListener("DOMContentLoaded", () => {
            document.querySelectorAll(".card").forEach(card => {
                const highRes = card.getAttribute("data-bg");
                const img = new Image();
                img.src = highRes;
                img.onload = () => {
                    card.style.backgroundImage = `url('${highRes}')`;
                    card.classList.add("loaded");
                };
            });
        });
    </script>
    <script>
        document.getElementById('year').textContent = new Date().getFullYear();
