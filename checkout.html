<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Checkout | Baki Photography</title>
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <link rel="stylesheet" href="css/videos.css">
  <style>
    :root{ --brand:#ff8a00; --ink:#111; --muted:#666; --bg:#f6f6f6; }
    html,body{margin:0;background-image: linear-gradient(rgba(0, 0, 0, 0.75), rgba(0, 0, 0, 0.75)), url(../pics/background.JPEG);color:var(--ink);font-family:system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif}
    .wrap{max-width:960px;margin:0 auto;padding:20px}
    header{display:flex;align-items:center;gap:12px;padding:12px 0;justify-content: space-between;}
    header img{height:200px}
    h1{margin:6px 0 18px;font-size:28px}
    .grid{display:grid;grid-template-columns:1.2fr .8fr;gap:20px}
    @media (max-width:820px){.grid{grid-template-columns:1fr}}
    .card{background:rgba(255, 255, 255, 0.1);border-radius:16px;box-shadow:0 12px 30px rgba(0,0,0,.08);padding:45px;padding-left: 10px;}
    .items{display:grid;gap:12px}
    .line{display:grid;grid-template-columns:64px 1fr auto;gap:12px;align-items:center;padding:8px 0;border-bottom:1px dashed #eee}
    .line:last-child{border-bottom:none}
    .line img{width:64px;height:64px;object-fit:cover;border-radius:10px}
    .title{font-weight:800}
    .muted{color:var(--muted);font-size:13px}
    .right{text-align:right}
    .row{display:flex;justify-content:space-between;margin:6px 0;font-weight:700}
    .total{font-size:20px}
    .btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:12px 16px;border:none;border-radius:12px;background:var(--brand);color:#fff;font-weight:900;cursor:pointer}
    .btn.secondary{background:#fff;color:var(--ink);border:1px solid #ddd}
    form{display:grid;gap:12px}
    label{font-size:13px;color:#fff}
    input,textarea{width:100%;padding:12px;border:1px solid #ddd;border-radius:10px;font-size:16px;background-color: #252525;color:#fff}
    textarea{min-height:110px;resize:vertical}
    .actions{display:flex;gap:12px;flex-wrap:wrap;margin-top:8px}
    .empty{padding:12px;color:var(--muted)}
    .site-footer{margin-top:24px;color:#fff;opacity:.9;text-align:center;padding-bottom:24px}
    .msg{margin-top:12px;font-weight:700;display:none}
    .msg.ok{color:#b8ffb3}
    .msg.err{color:#ffb3b3}
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <a href="booking.html" class="btn secondary">← Back</a>
      <img src="signature.PNG" alt="Baki Photography" />
    </header>

    <h1>Review & Checkout</h1>

    <div class="grid">
      <!-- Order Summary -->
      <section class="card">
        <h2 style="margin:0 0 12px">Your Selection</h2>
        <div id="items" class="items"></div>
        <div id="empty" class="empty" style="display:none">Your cart is empty.</div>
        <hr style="border:none;height:1px;background:#eee;margin:12px 0">
        <div class="row"><span>Subtotal</span><span id="sub">$0</span></div>
        <div class="row"><span class="muted">Tax (placeholder)</span><span id="tax">$0</span></div>
        <div class="row total"><span>Total</span><span id="tot">$0</span></div>
      </section>

      <!-- Booking Form (Formspree) -->
      <section class="card">
        <h2 style="margin:0 0 12px">Your Details</h2>

        <!-- Your Formspree endpoint -->
        <form id="bookingForm"
              action="https://formspree.io/f/mandaryp"
              method="POST">
          <input type="hidden" name="_subject" value="New Photoshoot Booking Request" />
          <input type="hidden" name="_replyto" id="fs_replyto" value="" />
          <!-- This is what Formspree will email (clean invoice text) -->
          <input type="hidden" name="invoice" id="invoice_text" />
          <!-- Keep JSON for JS only (NOT emailed, no name attr) -->
          <input type="hidden" id="cart_json" value="{}">

          <div>
            <label for="name">Full Name</label>
            <input id="name" name="name" required autocomplete="name" />
          </div>
          <div>
            <label for="email">Email</label>
            <input id="email" type="email" name="email" required autocomplete="email" />
          </div>
          <div>
            <label for="phone">Phone</label>
            <input id="phone" name="phone" autocomplete="tel" />
          </div>
          <div>
            <label for="date">Preferred Date</label>
            <input id="date" type="date" name="preferred_date" />
          </div>
          <div>
            <label for="time">Preferred Time</label>
            <input id="time" type="time" name="preferred_time" />
          </div>
          <div>
            <label for="notes">Notes / Location / Special Requests</label>
            <textarea id="notes" name="notes"></textarea>
          </div>

          <div class="actions">
            <button id="payBtn" class="btn" type="submit">Pay & Book</button>
            <a class="btn secondary" href="booking.html">Edit Selection</a>
          </div>
          <div id="ok" class="msg ok">Thank you for your submission, Note (We will reach out to you about payment options soon!) </div>
          <div id="err" class="msg err"></div>
        </form>
      </section>
    </div>

    <footer class="site-footer">
      © <span id="year"></span> Baki Photography — All rights reserved.
    </footer>
  </div>

  <script>
    // --- Cart helpers ---
    const CART_KEY = 'bkCart';
    function readCart(){ try{ return JSON.parse(localStorage.getItem(CART_KEY))||{} }catch(e){return{}} }
    function toList(o){ return Object.values(o||{}) }
    function money(n){ return '$' + Number(n||0).toFixed(2) }
    function computeTotals(){
      const list = toList(readCart());
      const sub = list.reduce((s,i)=>s + Number(i.price)*Number(i.qty), 0);
      const taxRate = 0.075;
      const tax = sub * taxRate; 
      const tot = sub + tax;
      return { list, sub, tax, tot };
    }
    function render(){
      const {list,sub,tax,tot}=computeTotals();
      const itemsEl=document.getElementById('items');
      const emptyEl=document.getElementById('empty');
      itemsEl.innerHTML='';
      if(list.length===0){ emptyEl.style.display='block'; }
      else {
        emptyEl.style.display='none';
        list.forEach(i=>{
          const row=document.createElement('div');
          row.className='line';
          row.innerHTML=`<img src="${i.img}" alt="">
            <div><div class="title">${i.title}</div>
            <div class="muted">$${Number(i.price).toFixed(2)} × ${i.qty}</div></div>
            <div class="right"><strong>${money(Number(i.price)*Number(i.qty))}</strong></div>`;
          itemsEl.appendChild(row);
        });
      }
      document.getElementById('sub').textContent=money(sub);
      document.getElementById('tax').textContent=money(tax);
      document.getElementById('tot').textContent=money(tot);

      // Keep compact JSON in the page (not emailed)
      const cartPayload = {
        items: list.map(i => ({ id:i.id, title:i.title, price:Number(i.price), qty:Number(i.qty) })),
        totals: { subtotal: sub, tax, total: tot }
      };
      const cj = document.getElementById('cart_json');
      if (cj) cj.value = JSON.stringify(cartPayload);
    }
    render();
    document.getElementById('year').textContent=new Date().getFullYear();

    // --- AJAX Formspree submit ---
    const form = document.getElementById('bookingForm');
    const okEl = document.getElementById('ok');
    const errEl = document.getElementById('err');
    const payBtn = document.getElementById('payBtn');

    function showErr(msg){
      errEl.textContent = msg || 'Something went wrong.';
      errEl.style.display = 'block';
      okEl.style.display = 'none';
    }
    function showOk(){
      errEl.style.display = 'none';
      okEl.style.display = 'block';
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    form.addEventListener('submit', async (e) => {
      e.preventDefault();

      const {list,sub,tax,tot}=computeTotals();
      if(!list.length){ return showErr('Your cart is empty.'); }

      const name  = document.getElementById('name').value.trim();
      const email = document.getElementById('email').value.trim();
      if(!name || !email){ return showErr('Name and email required.'); }

      // Build clean invoice text
      const phone = document.getElementById('phone').value.trim();
      const d     = document.getElementById('date').value;
      const t     = document.getElementById('time').value;
      const notes = document.getElementById('notes').value.trim();

      const lines = [];
      lines.push('Baki Photography — Booking Request');
      lines.push(`Name: ${name}`);
      lines.push(`Email: ${email}`);
      if (phone) lines.push(`Phone: ${phone}`);
      if (d)     lines.push(`Preferred Date: ${d}`);
      if (t)     lines.push(`Preferred Time: ${t}`);
      if (notes) lines.push(`Notes: ${notes}`);
      lines.push('');
      lines.push('Items:');
      list.forEach(i=>{
        const lineTotal = Number(i.price)*Number(i.qty);
        lines.push(`• ${i.title} — $${Number(i.price).toFixed(2)} × ${i.qty} = ${money(lineTotal)}`);
      });
      lines.push('');
      lines.push(`Subtotal: ${money(sub)}`);
      lines.push(`Tax: ${money(tax)}`);
      lines.push(`Total: ${money(tot)}`);

      // >>> Ensure invoice field is populated for FormData
      const invoiceField = document.getElementById('invoice_text');
      const invoiceBody  = lines.join('\n');
      invoiceField.value = invoiceBody;
      invoiceField.setAttribute('value', invoiceBody); // extra-safe for some browsers

      // Set reply-to for convenience
      document.getElementById('fs_replyto').value = email;

      // Disable button while sending
      payBtn.disabled = true;
      payBtn.textContent = 'Sending...';

      try{
        const data = new FormData(form);
        const resp = await fetch(form.action, {
          method: 'POST',
          body: data,
          headers: { 'Accept': 'application/json' }
        });

        if (resp.ok) {
          showOk();
          // hide actions after success
          const actions = form.querySelector('.actions');
          if (actions) actions.style.display = 'none';
          // clear form & cart
          form.reset();
          try { localStorage.removeItem(CART_KEY); } catch {}
          render();
        } else {
          showErr('Submission failed. Please try again.');
        }
      } catch (err) {
        console.error(err);
        showErr('Network error. Please try again.');
      } finally {
        payBtn.disabled = false;
        payBtn.textContent = 'Pay & Book';
      }
    });
  </script>
</body>
</html>
